<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauer-Aufstieg – Modell-Check</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8a0f0f; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
    canvas { display: block; }

    /* Alle Texte liegen als HTML über dem 3D-Bild */
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none;
      text-shadow: 0 3px 0 #3a0000, 0 6px 18px rgba(0,0,0,.6);
    }
    .hidden { display: none !important; }
    #loading { font-size: 42px; font-weight: 900; letter-spacing: .04em; }

    /* Kontroll-Liste für Block 0 (oben links) */
    #status {
      position: fixed; top: 12px; left: 12px; padding: 10px 14px;
      background: rgba(30,0,0,.55); border-radius: 10px; font-size: 14px; line-height: 1.5;
    }
    #status b { font-size: 16px; }
    #status .ok { color: #9dffb0; }
    #status .warn { color: #ffd36b; }
    #fps { position: fixed; top: 12px; right: 12px; font: 700 16px ui-monospace, monospace; }
  </style>

  <!-- Import Map: sagt dem Browser, wo "three" liegt (lokal, ohne Internet) -->
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading" class="overlay">Lade Figuren …</div>
  <div id="status" class="hidden"></div>
  <div id="fps"></div>

  <script type="module" src="./modelcheck.js"></script>
</body>
</html>
